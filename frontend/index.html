<!DOCTYPE html>
<html>
<head>
    <title>AI Interview System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h3 class="text-center mb-4">AI Interview System</h3>

        <!-- Name -->
        <div class="mb-3">
            <label class="form-label">Your Name</label>
            <input id="name" type="text" class="form-control" placeholder="Enter your name">
        </div>

       <!-- Question -->
<div class="mb-3">
    <label class="form-label">Interview Question</label>
    <textarea id="question" class="form-control" rows="2"
        placeholder="Enter interview question..."></textarea>
</div>

<!-- Reference Answer -->
<div class="mb-3">
    <label class="form-label">Reference Answer (Expected)</label>
    <textarea id="modelAnswer" class="form-control" rows="3"
        placeholder="Enter expected answer for evaluation..."></textarea>
</div>

<!-- User Answer -->
<div class="mb-3">
    <label class="form-label">Your Answer</label>
    <textarea id="answer" class="form-control" rows="4"
        placeholder="Type your answer here..."></textarea>
</div>

        <!-- Submit -->
        <button type="button" class="btn btn-primary w-100" onclick="submitAnswer()">
            Submit
        </button>

        <!-- Result -->
        <div id="result" class="mt-4"></div>
    </div>
</div>
<script>
function submitAnswer() {
    const name = document.getElementById("name").value.trim();
    const question = document.getElementById("question").value.trim();
    const modelAnswer = document.getElementById("modelAnswer").value.trim();
    const answer = document.getElementById("answer").value.trim();

    if (!name || !question || !modelAnswer || !answer) {
        alert("Please fill all fields.");
        return;
    }

    fetch("http://localhost:8080/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            name: name,
            question: question,
            modelAnswer: modelAnswer,
            answer: answer
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("result").innerHTML = `
            <hr>
            <h4>Score: ${data.score}</h4>
            <p><strong>Feedback:</strong> ${data.feedback}</p>
        `;
    })
    .catch(() => alert("Error connecting to server."));
}
</script>

</body>
</html>
