<!DOCTYPE html>
<html>
<head>
    <title>AI Interview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h3 class="text-center mb-4">AI Interview System</h3>

        <form action="result.html" method="get">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" placeholder="Enter name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Role</label>
                <select class="form-select">
                    <option>Java Developer</option>
                    <option>Backend Developer</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Question</label>
                <textarea class="form-control" readonly>
Explain HashMap in Java.
                </textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Your Answer</label>
                <textarea class="form-control" rows="4" placeholder="Type your answer..." required></textarea>
            </div>

            <button class="btn btn-primary w-100">Submit Answer</button>

        </form>
    </div>
</div>

</body>
</html>
