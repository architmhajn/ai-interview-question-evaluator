<!DOCTYPE html>
<html>
<head>
    <title>AI Interview System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h3 class="text-center mb-4">AI Interview System</h3>

        <!-- Name -->
        <div class="mb-3">
            <label class="form-label">Your Name</label>
            <input id="name" type="text" class="form-control" placeholder="Enter your name">
        </div>

        <!-- Question -->
        <div class="mb-3">
            <label class="form-label">Question</label>
            <textarea class="form-control" readonly>
Explain HashMap in Java.
            </textarea>
        </div>

        <!-- Answer -->
        <div class="mb-3">
            <label class="form-label">Your Answer</label>
            <textarea id="answer" class="form-control" rows="4"
                placeholder="Type your answer here..."></textarea>
        </div>

        <!-- Submit -->
        <button type="button" class="btn btn-primary w-100" onclick="submitAnswer()">
            Submit
        </button>

        <!-- Result -->
        <div id="result" class="mt-4"></div>
    </div>
</div>

<script>
function submitAnswer() {

    const name = document.getElementById("name").value.trim();
    const answer = document.getElementById("answer").value.trim();

    if (name === "" || answer === "") {
        alert("Please enter your name and answer.");
        return;
    }

    fetch("http://localhost:8080/submit", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: name,
            answer: answer
        })
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById("result").innerHTML = `
            <hr>
            <h4>Score: ${data.score}</h4>
            <p><strong>Feedback:</strong> ${data.feedback}</p>
        `;
    })
    .catch(err => {
        console.error(err);
        alert("Error connecting to server.");
    });
}
</script>

</body>
</html>
